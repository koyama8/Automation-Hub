name: QA Automation Lab CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://dba:dba@localhost:5434/QALabDB?schema=public
  PORT: 3030
  WEB_URL: http://localhost:3000
  ADMIN_EMAIL: qa@adminlab.com
  ADMIN_PASSWORD: pwd123
  JWT_SECRET: qa-automation-lab-ci-secret
  JWT_EXPIRES_IN: 2h
  RESET_TOKEN_MINUTES: 15
  CI: true

jobs:
  quality-gates:
    name: Quality Gates BDD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CYPRESS_INSTALL_BINARY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Bloquear testes focados
        run: |
          if grep -R -nE '\.(only)\(' apps/api/cypress apps/web/cypress; then
            echo "Remova .only antes de rodar o CI."
            exit 1
          fi

      - name: Instalar dependencias da API
        working-directory: apps/api
        run: npm ci

      - name: Instalar dependencias da Web
        working-directory: apps/web
        run: npm ci

      - name: Validar qualidade da automacao BDD da API
        working-directory: apps/api
        run: npm run quality:check

      - name: Validar qualidade da automacao BDD da Web
        working-directory: apps/web
        run: npm run quality:check

      - name: Validar formatacao dos arquivos de configuracao
        working-directory: apps/api
        run: >-
          npx prettier --check
          "../../.github/workflows/*.yml"
          "../../.vscode/*.json"
          "package.json"
          "../web/package.json"

      - name: Resumo dos quality gates
        if: always()
        run: |
          echo "## Quality Gates BDD" >> "$GITHUB_STEP_SUMMARY"
          echo "- ESLint: API e Web" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prettier: Features, Steps, Clients, Pages e Factories" >> "$GITHUB_STEP_SUMMARY"
          echo "- Testes focados (.only): bloqueados" >> "$GITHUB_STEP_SUMMARY"

  api-tests:
    name: API Cypress
    runs-on: ubuntu-latest
    needs: quality-gates
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: dba
          POSTGRES_PASSWORD: dba
          POSTGRES_DB: QALabDB
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U dba -d QALabDB"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Restaurar cache do Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-api-${{ hashFiles('apps/api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cypress-api-
            ${{ runner.os }}-cypress-

      - name: Instalar dependencias da API
        working-directory: apps/api
        run: npm ci

      - name: Criar .env da API para CI
        working-directory: apps/api
        run: |
          cat > .env << EOF
          DATABASE_URL="${DATABASE_URL}"
          PORT="${PORT}"
          WEB_URL="${WEB_URL}"
          ADMIN_EMAIL="${ADMIN_EMAIL}"
          ADMIN_PASSWORD="${ADMIN_PASSWORD}"
          JWT_SECRET="${JWT_SECRET}"
          JWT_EXPIRES_IN="${JWT_EXPIRES_IN}"
          RESET_TOKEN_MINUTES="${RESET_TOKEN_MINUTES}"
          EOF

      - name: Preparar banco da API
        working-directory: apps/api
        run: |
          npm run prisma:generate
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Subir API
        working-directory: apps/api
        run: |
          nohup npm start > api-ci.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://localhost:3030/api/health; then
              exit 0
            fi

            sleep 2
          done

          cat api-ci.log
          exit 1

      - name: Rodar testes de API
        id: api_cypress
        working-directory: apps/api
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$CYPRESS_RECORD_KEY" ]; then
            npx cypress run --record --key "$CYPRESS_RECORD_KEY" --group "API Cypress" --ci-build-id "${{ github.run_id }}-${{ github.run_attempt }}" --browser electron --config video=false
          else
            echo "CYPRESS_RECORD_KEY indisponivel; executando sem gravacao no Cypress Cloud."
            npx cypress run --browser electron --config video=false
          fi

      - name: Resumo da execucao da API
        if: always()
        run: |
          echo "## API Cypress" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resultado: ${{ steps.api_cypress.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Evento: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Escopo: suite completa da API" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload relatorio Cucumber API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-api
          path: apps/api/cypress/reports/cucumber
          if-no-files-found: warn
          retention-days: 14

      - name: Upload evidencias API
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-cypress-artifacts
          path: |
            apps/api/cypress/screenshots
            apps/api/cypress/videos
            apps/api/api-ci.log
          if-no-files-found: ignore
          retention-days: 7

  web-tests:
    name: Web Cypress
    runs-on: ubuntu-latest
    needs: quality-gates
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: dba
          POSTGRES_PASSWORD: dba
          POSTGRES_DB: QALabDB
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U dba -d QALabDB"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Restaurar cache do Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-web-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cypress-web-
            ${{ runner.os }}-cypress-

      - name: Instalar dependencias da API
        working-directory: apps/api
        run: npm ci

      - name: Criar .env da API para CI
        working-directory: apps/api
        run: |
          cat > .env << EOF
          DATABASE_URL="${DATABASE_URL}"
          PORT="${PORT}"
          WEB_URL="${WEB_URL}"
          ADMIN_EMAIL="${ADMIN_EMAIL}"
          ADMIN_PASSWORD="${ADMIN_PASSWORD}"
          JWT_SECRET="${JWT_SECRET}"
          JWT_EXPIRES_IN="${JWT_EXPIRES_IN}"
          RESET_TOKEN_MINUTES="${RESET_TOKEN_MINUTES}"
          EOF

      - name: Preparar banco para testes web
        working-directory: apps/api
        run: |
          npm run prisma:generate
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Subir API
        working-directory: apps/api
        run: |
          nohup npm start > api-ci.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://localhost:3030/api/health; then
              exit 0
            fi

            sleep 2
          done

          cat api-ci.log
          exit 1

      - name: Instalar dependencias da Web
        working-directory: apps/web
        run: npm ci

      - name: Rodar testes web
        id: web_cypress
        working-directory: apps/web
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$CYPRESS_RECORD_KEY" ]; then
            npx cypress run --record --key "$CYPRESS_RECORD_KEY" --group "Web Cypress" --ci-build-id "${{ github.run_id }}-${{ github.run_attempt }}" --browser electron --config video=false
          else
            echo "CYPRESS_RECORD_KEY indisponivel; executando sem gravacao no Cypress Cloud."
            npx cypress run --browser electron --config video=false
          fi

      - name: Resumo da execucao Web
        if: always()
        run: |
          echo "## Web Cypress" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resultado: ${{ steps.web_cypress.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Evento: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Escopo: suite completa Web" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload relatorio Cucumber Web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-web
          path: apps/web/cypress/reports/cucumber
          if-no-files-found: warn
          retention-days: 14

      - name: Upload evidencias Web
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-cypress-artifacts
          path: |
            apps/web/cypress/screenshots
            apps/web/cypress/videos
            apps/api/api-ci.log
          if-no-files-found: ignore
          retention-days: 7

  publish-cucumber-reports:
    name: Publicar relatorios Cucumber
    if: github.event_name != 'pull_request'
    needs:
      - api-tests
      - web-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar relatorio Web
        uses: actions/download-artifact@v4
        with:
          name: cucumber-report-web
          path: pages/web

      - name: Baixar relatorio API
        uses: actions/download-artifact@v4
        with:
          name: cucumber-report-api
          path: pages/api

      - name: Montar portal de relatorios
        run: |
          cp reports/site/index.html pages/index.html
          touch pages/.nojekyll

          cd pages
          zip -r cucumber-reports.zip web api

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Resumo da publicacao
        run: |
          echo "## Relatorios Cucumber" >> "$GITHUB_STEP_SUMMARY"
          echo "- Portal: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
