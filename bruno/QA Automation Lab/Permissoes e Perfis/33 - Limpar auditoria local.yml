info:
  name: Limpar auditoria local
  type: http
  seq: 33

http:
  method: DELETE
  url: http://localhost:3030/api/permissions/audit
  body:
    type: json
    data: |-
      {
        "confirmation": "CLEAR_AUDIT",
        "reason": "Limpeza da massa de auditoria do ambiente local"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Remove os registros de auditoria somente em ambiente local ou de teste. Requer autenticação de administrador e confirmação explícita. Em produção, retorna 403.
