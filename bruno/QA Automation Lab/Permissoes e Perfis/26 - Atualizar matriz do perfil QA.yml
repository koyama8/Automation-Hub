info:
  name: Atualizar matriz do perfil QA
  type: http
  seq: 26

http:
  method: PUT
  url: http://localhost:3030/api/permissions/profiles/qa
  body:
    type: json
    data: |-
      {
        "version": {{profileVersion}},
        "reason": "Revisao controlada da matriz padrao do perfil QA",
        "permissions": [
          "clients:read", "clients:write",
          "contracts:read", "contracts:write",
          "products:read", "products:write",
          "cart:read", "cart:write",
          "orders:read", "orders:write",
          "payments:read", "payments:write",
          "coupons:read", "coupons:write",
          "evidences:read", "evidences:write",
          "reports:read", "reports:export"
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (res.getStatus() === 200) bru.setVar("profileVersion", String(body.data.version));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Atualiza a matriz com controle de versao e gera auditoria. A lista mantem as permissoes QA padrao.
