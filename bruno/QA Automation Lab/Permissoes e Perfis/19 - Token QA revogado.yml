    token: "{{qaToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Usa o token emitido antes da mudanca de perfil. Esperado 401 porque authVersion e sessao foram revogados.
