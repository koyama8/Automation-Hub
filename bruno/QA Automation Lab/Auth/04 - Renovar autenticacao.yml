info:
  name: Renovar autenticacao
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:3030/api/auth/refresh
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (res.getStatus() === 200) {
          bru.setVar("authToken", body.data.token);
          bru.setVar("refreshToken", body.data.refreshToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Rotaciona o refresh token e emite um novo access token. O refresh token anterior deixa de ser valido.
